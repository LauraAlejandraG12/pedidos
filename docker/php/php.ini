; Ajustes de PHP para el módulo de pedidos.
error_reporting = E_ALL
display_errors = On
log_errors = On

memory_limit = 256M
upload_max_filesize = 16M
post_max_size = 16M

date.timezone = America/Bogota

; OPcache en modo desarrollo (recompila al tocar el archivo).
opcache.enable = 1
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
